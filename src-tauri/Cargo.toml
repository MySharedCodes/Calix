[package]
name = "calix"
version = "0.1.28"
description = "CALculation and Interactive eXpressions"
authors = ["Calix"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MySharedCodes/Calix"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
