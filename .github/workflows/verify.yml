name: Verify Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: ./.venv/Scripts/python.exe -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: ./scripts/bootstrap-native.ps1
      - run: npm run build
      - run: ./.venv/Scripts/python.exe scripts/verify.py --tier core
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - run: ./.venv/Scripts/python.exe scripts/verify-ui.py
        env:
          CALIX_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-verification
          path: work/verification/
  numerical:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-pde.txt -r requirements-sparse.txt
      - run: ./scripts/bootstrap-native.ps1
      - run: python scripts/stage-sparse-runtime.py
      - run: python scripts/verify.py --tier numerical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-verification
          path: work/verification/
